aid: teesnap
url: https://raw.githubusercontent.com/api-evangelist/teesnap/refs/heads/main/apis.yml
name: Teesnap
kind: company
description: >-
  Teesnap is an all-in-one golf course management platform and point-of-sale
  system for golf operators, founded in 2013 and based in Las Vegas, Nevada. Its
  cloud software suite covers a tee sheet and tee-time booking engine, golf and
  food-and-beverage point of sale, customer and membership management, an online
  store, websites, payments, and a marketing and reporting system. Teesnap
  connects to the wider golf ecosystem through partner integrations - GolfNow
  (its official online tee-time distribution partner via NBC Sports Next),
  Priswing dynamic pricing, Golf Genius tournament management, QuickBooks Online
  accounting, Gallus mobile apps, Heartland payment processing, and range
  hardware from eRange and Select Pi. As of this catalog's review date Teesnap
  does not publish a public, self-service developer API or developer portal;
  integrations are delivered through partner-gated, business-development
  relationships. The APIs listed here are honestly modeled from Teesnap's public
  product surface and are not sourced from published API documentation.
